# ═══════════════════════════════════════════════════════════════════
#  TOPU OS — Hyprland Configuration
#  Location: ~/.config/hypr/hyprland.conf
# ═══════════════════════════════════════════════════════════════════

# ── Monitor ──────────────────────────────────────────────────────────
monitor=,preferred,auto,1

# ── Startup ───────────────────────────────────────────────────────────
exec-once = waybar                          # Open-apps dock
exec-once = mako                            # Notification daemon
exec-once = /usr/local/bin/topu-voice      # TOPU voice engine daemon
exec-once = swayidle -w \
  timeout 300 'swaylock -f' \
  timeout 600 'hyprctl dispatch dpms off' \
  resume 'hyprctl dispatch dpms on'

# ── TOPU Identity ─────────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# ── Input ─────────────────────────────────────────────────────────────
input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

# ── General ───────────────────────────────────────────────────────────
general {
  gaps_in = 6
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(00d4ffee) rgba(7c3aedee) 45deg
  col.inactive_border = rgba(1a1f2c88)
  layout = floating
  allow_tearing = false
}

# ── Decoration ─────────────────────────────────────────────────────────
decoration {
  rounding = 10
  blur {
    enabled = true
    size = 8
    passes = 2
    vibrancy = 0.2
  }
  drop_shadow = true
  shadow_range = 20
  shadow_render_power = 3
  col.shadow = rgba(00d4ff22)
}

# ── Animations ─────────────────────────────────────────────────────────
animations {
  enabled = true
  bezier = bounce,  0.05, 0.9, 0.1, 1.05
  bezier = smooth,  0.25, 0.46, 0.45, 0.94
  bezier = snappy,  0.5,  1,   0.89, 1
  animation = windows,     1, 5,  bounce
  animation = windowsOut,  1, 4,  smooth, popin 80%
  animation = fade,        1, 4,  smooth
  animation = workspaces,  1, 5,  snappy, slidevert
}

# ── Layout (Floating only — voice controls everything) ─────────────────
dwindle {
  pseudotile = false
  preserve_split = true
}

# ── Window Rules ───────────────────────────────────────────────────────
windowrule = float, .*
windowrule = center, .*
windowrule = size 60% 70%, .*

# Terminal (foot) — compact
windowrule = size 800 500, foot
windowrule = center, foot

# Gaming — fullscreen, hide dock
windowrule = fullscreen, steam_app_.*
windowrule = fullscreen, gamescope

# Installer — fullscreen
windowrule = fullscreen, calamares

# Settings overlay — medium panel
windowrule = size 900 650, topu-settings

# ── Wallpaper ───────────────────────────────────────────────────────────
exec-once = hyprpaper || swaybg -m fill -i /usr/share/topu/wallpaper.png

# ── Keybinds (minimal — voice is primary) ─────────────────────────────
$mod = SUPER

# Emergency bindings only (voice controls everything else)
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod SHIFT, E, exec, systemctl poweroff

# Screenshot (also voice-triggered: "Hey TOPU, screenshot")
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
